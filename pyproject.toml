[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-routing"
version = "0.1.0"
description = "Speech-Preservation Routing Under Streaming Resource Constraints for Home Smart Displays"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
speech-routing = "speech_routing.cli:main"

[tool.setuptools.packages.find]
include = ["speech_routing*"]
